[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sightline"
version = "0.1.0"
description = "Live workshop hazard watcher (Meta V-JEPA 2.1 + concept-bottleneck head) for shift supervisors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "streamlit>=1.38",
  "plotly>=5.22",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "Pillow>=10.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
vision = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.33",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["sightline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
